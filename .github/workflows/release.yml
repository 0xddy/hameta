name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-web:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build Vue 3 assets
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  build-linux:
    needs: build-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact_name: hameta-linux-amd64
            features: "--features mimalloc"
            is_musl: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            artifact_name: hameta-linux-amd64-musl
            features: ""
            is_musl: true
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: hameta-linux-arm64
            features: "--features mimalloc"
            is_musl: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            artifact_name: hameta-linux-arm64-musl
            features: ""
            is_musl: true
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Install musl tools if needed
        if: matrix.is_musl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: |
          cargo build --release -p hameta-cli --target "${{ matrix.target }}" ${{ matrix.features }}

      - name: Package release tarball
        run: |
          PKG_DIR="pkg/${{ matrix.artifact_name }}"
          mkdir -p "${PKG_DIR}/deploy" "${PKG_DIR}/scripts"
          cp "target/${{ matrix.target }}/release/hameta" "${PKG_DIR}/hameta"
          chmod 0755 "${PKG_DIR}/hameta"
          cp deploy/hameta-ctl.sh deploy/hameta.init deploy/hameta.service "${PKG_DIR}/deploy/"
          chmod 0755 "${PKG_DIR}/deploy/hameta-ctl.sh" "${PKG_DIR}/deploy/hameta.init"
          cp scripts/install.sh "${PKG_DIR}/scripts/"
          chmod 0755 "${PKG_DIR}/scripts/install.sh"
          cp LICENSE README.md "${PKG_DIR}/"
          mkdir -p dist
          tar -czf "dist/${{ matrix.artifact_name }}.tar.gz" -C "${PKG_DIR}" .

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
      - name: Download all release packages
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives and generate SHA256SUMS
        run: |
          mkdir -p release-files
          find artifacts -type f -name '*.tar.gz' -exec cp {} release-files/ \;
          (cd release-files && sha256sum *.tar.gz > SHA256SUMS.txt)
          cat release-files/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-files/* --clobber --repo "${{ github.repository }}"
          else
            gh release create "$TAG_NAME" release-files/* \
              --repo "${{ github.repository }}" \
              --title "Hameta ${TAG_NAME}" \
              --generate-notes
          fi
